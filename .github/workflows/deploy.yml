name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hrline-landing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}
      REGISTRY: registry.digitalocean.com/hrline-registry
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/hrline-landing:${{ env.TAG }}
            ${{ env.REGISTRY }}/hrline-landing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update GitOps Repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/Innovateuz/gitops.git /tmp/gitops
          cd /tmp/gitops
          sed -i "s|tag:.*|tag: ${{ env.TAG }}|g" values/hrline/hrline-landing.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values/hrline/hrline-landing.yaml
          git commit -m "chore(hrline): deploy hrline-landing tag ${{ env.TAG }}" || exit 0
          git push origin main
          echo "✅ GitOps repo updated with new hrline-landing tag!"

      - name: Trigger Instant Argo CD Sync
        run: |
          kubectl patch application hrline-landing -n argocd --type merge -p '{"operation":{"sync":{"prune":true}}}' || true

      - name: Verify Kubernetes Rollout Status
        run: |
          echo "⏳ Waiting for hrline-landing rollout..."
          if ! kubectl rollout status deployment/hrline-landing -n hrline --timeout=90s; then
            echo "❌ Deployment hrline-landing failed to roll out!"
            kubectl get pods -n hrline -l app=hrline-landing
            kubectl logs -n hrline -l app=hrline-landing --tail=50 || true
            exit 1
          fi
          echo "✅ hrline-landing successfully rolled out!"
